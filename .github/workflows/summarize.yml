name: summarize

on:
  workflow_dispatch:
    inputs:
      url:
        description: "単発URL（任意）"
        required: false
        type: string
      seed_file:
        description: "URLリスト（1行1件）"
        required: false
        type: string
      style:
        description: "出力スタイル"
        required: false
        type: choice
        options: [general, casual, formal]
        default: general
      lang:
        description: "言語"
        required: false
        type: choice
        options: [ja, en]
        default: ja
      model:
        description: "モデル名（固定運用: gemini-2.5-flash）"
        required: false
        type: string
        default: "gemini-2.5-flash"
      publish_to_docs:
        description: "Obsidianに自動保存（docsへコミット）"
        required: false
        type: boolean
        default: true
      docs_path:
        description: "出力先フォルダ（Obsidianで見るルート）"
        required: false
        type: string
        default: "news"

permissions:
  contents: write
  actions: read

env:
  TZ: "Asia/Tokyo"
  NODE_OPTIONS: "--dns-result-order=ipv4first"
  ARTIFACT_NAME: "summary"

jobs:
  summarize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps (preflight)
        run: |
          npm i jsdom @mozilla/readability undici@6

      - name: Inject API keys (alias) & flags
        run: |
          if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> $GITHUB_ENV
            echo "GOOGLE_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> $GITHUB_ENV
          elif [ -n "${{ secrets.GOOGLE_API_KEY }}" ]; then
            echo "GEMINI_API_KEY=${{ secrets.GOOGLE_API_KEY }}" >> $GITHUB_ENV
            echo "GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}" >> $GITHUB_ENV
          else
            echo "::error::GEMINI_API_KEY / GOOGLE_API_KEY が未設定"; exit 1
          fi

          if [ -n "${{ secrets.DISCORD_WEBHOOK_URL }}" ]; then
            echo "HAS_DISCORD_WEBHOOK=1" >> $GITHUB_ENV
            echo "DISCORD_WEBHOOK_URL=${{ secrets.DISCORD_WEBHOOK_URL }}" >> $GITHUB_ENV
          else
            echo "HAS_DISCORD_WEBHOOK=0" >> $GITHUB_ENV
          fi

      - name: Enforce input policy (url or seed_file required)
        run: |
          if [ -z "${{ github.event.inputs.url }}" ] && [ -z "${{ github.event.inputs.seed_file }}" ]; then
            echo "::error::input_policy違反: url か seed_file のどちらか必須"; exit 1;
          fi

      - name: Gemini preflight
        env:
          GOOGLE_API_KEY: ${{ env.GOOGLE_API_KEY }}
        run: |
          node -e 'import { fetch } from "undici";
          const key = process.env.GOOGLE_API_KEY;
          const ep = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${key}`;
          const body = {contents:[{role:"user",parts:[{text:"health-check"}]}]};
          const r = await fetch(ep,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)});
          if(!r.ok){console.error("Gemini preflight:", r.status, await r.text()); process.exit(1);}'

      - name: Run summarize.mjs
        env:
          GOOGLE_API_KEY: ${{ env.GOOGLE_API_KEY }}
        run: |
          node scripts/summarize.mjs \
            --url '${{ github.event.inputs.url }}' \
            --seed-file '${{ github.event.inputs.seed_file }}' \
            --style '${{ github.event.inputs.style }}' \
            --lang '${{ github.event.inputs.lang }}' \
            --model '${{ github.event.inputs.model }}' \
            --docs-path '${{ github.event.inputs.docs_path }}' \
            --publish-to-docs '${{ github.event.inputs.publish_to_docs }}' \
            2>&1 | tee summarize.log

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: summary/

      - name: Publish to docs (optional)
        if: ${{ github.event.inputs.publish_to_docs == 'true' }}
        run: |
          set -e
          DOCS="${{ github.event.inputs.docs_path }}"
          mkdir -p "$DOCS"
          rsync -av summary/ "$DOCS"/
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DOCS"
          git commit -m "publish(summarize): $GITHUB_RUN_ID" || echo "no changes"
          git push

      - name: Discord notify (optional)
        if: env.HAS_DISCORD_WEBHOOK == '1'
        continue-on-error: true
        run: |
          curl -s -X POST -H "Content-Type: application/json" \
            -d "{\"content\":\"✅ ai-news-bot: run $GITHUB_RUN_NUMBER finished (publish_to_docs=${{ github.event.inputs.publish_to_docs }})\"}" \
            "$DISCORD_WEBHOOK_URL" || true

      - name: Always upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: summarize-log
          path: summarize.log
