name: summarize

# on:
  workflow_dispatch:
on:
  workflow_dispatch:
    inputs:
      url:
        description: "単発URL（任意）"
        required: false
        type: string
      seed_file:
        description: "シード一覧のパス（任意）"
        required: false
        type: string
      publish_to_docs:
        description: "news/ に反映する？"
        required: false
        type: boolean
        default: true
      docs_path:
        description: "出力先ディレクトリ"
        required: false
        type: string
        default: "news"
  repository_dispatch:
    types: [sum]   # Discordワーカーからのイベント

permissions:
  contents: write
  actions: read

concurrency:
  group: summarize-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_OPTIONS: --dns-result-order=ipv4first
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }} # 別名でも参照されるように

jobs:
  summarize:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm i --no-audit --no-fund
          fi

      - name: Resolve inputs (workflow_dispatch / repository_dispatch 両対応)
        id: inp
        run: |
          URL="${{ github.event.inputs.url }}"
          SEED="${{ github.event.inputs.seed_file }}"
          PD="${{ github.event.inputs.publish_to_docs }}"
          DP="${{ github.event.inputs.docs_path }}"

          # repository_dispatch（Discordワーカー）経由の値でフォールバック
          if [ -z "$URL" ]; then URL="${{ github.event.client_payload.url }}"; fi
          if [ -z "$SEED" ]; then SEED="${{ github.event.client_payload.seed_file }}"; fi
          if [ -z "$PD" ]; then PD="${{ github.event.client_payload.publish_to_docs }}"; fi
          if [ -z "$DP" ]; then DP="${{ github.event.client_payload.docs_path }}"; fi

          # 既定値
          if [ -z "$PD" ]; then PD=true; fi
          if [ -z "$DP" ]; then DP="news"; fi

          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "seed_file=$SEED" >> $GITHUB_OUTPUT
          echo "publish_to_docs=$PD" >> $GITHUB_OUTPUT
          echo "docs_path=$DP" >> $GITHUB_OUTPUT

      - name: Run summarize.mjs (modelはスクリプト側で gemini-2.5-flash に強制固定)
        run: |
          set -euo pipefail
          mkdir -p summary

          U="${{ steps.inp.outputs.url }}"
          S="${{ steps.inp.outputs.seed_file }}"

          echo "::group::inputs"
          echo "[debug] url=${U:-<empty>}"
          echo "[debug] seed_file=${S:-<empty>}"
          echo "::endgroup::"

          ARGS=()
          if [ -n "${U:-}" ]; then ARGS+=("--url" "$U"); fi
          if [ -n "${S:-}" ]; then ARGS+=("--seed-file" "$S"); fi

          # 入力がゼロなら明示的に失敗させる（成功扱いで終わらないように）
          if [ ${#ARGS[@]} -eq 0 ]; then
            echo "::error::No url or seed_file provided"
            exit 1
          fi

          node .dev/scripts/summarize.mjs \
            "${ARGS[@]}" \
            --style general --lang ja --model gemini-2.5-flash \
            2>&1 | tee summarize.log

      - name: Sanity check outputs (debug)
        if: always()
        run: |
          echo "::group::tree summary"
          if [ -d summary ]; then find summary -maxdepth 3 -type f -print; else echo "summary/ <missing>"; fi
          echo "::endgroup::"
          echo "::group::head summarize.log"
          sed -n '1,80p' summarize.log || true
          echo "::endgroup::"

      - name: Upload artifacts (summary + log)
        uses: actions/upload-artifact@v4
        with:
          name: summary
          path: |
            summary/**/*
            summarize.log
          if-no-files-found: warn
          retention-days: 7

      - name: Commit to ${{ steps.inp.outputs.docs_path }}
        if: ${{ steps.inp.outputs.publish_to_docs == 'true' }}
        run: |
          set -e
          DOCS="${{ steps.inp.outputs.docs_path }}"
          mkdir -p "$DOCS"

          # summary/ 以下の .md をすべて news/ 等へコピー
          find summary -type f -name '*.md' -print -exec cp -f {} "$DOCS"/ \;

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "ci(summary): add/update news"
            git push
          fi
