name: summarize

on:
  workflow_dispatch:
    inputs:
      url:
        description: "単発URL（任意）"
        required: false
        type: string
      seed_file:
        description: "シード一覧のパス（URLリスト）"
        required: false
        type: string
      style:
        description: "出力スタイル"
        required: false
        type: choice
        options: [general, casual, formal]
        default: general
      lang:
        description: "言語"
        required: false
        type: choice
        options: [ja, en]
        default: ja
      model:
        description: "モデル名（既定は gemini-2.5-flash）"
        required: false
        type: string
        default: "gemini-2.5-flash"
      publish_to_docs:
        description: "docs に反映する？"
        required: false
        type: boolean
        default: true
      docs_path:
        description: "docs 出力先"
        required: false
        type: string
        default: "docs/ai-news-bot"

permissions:
  contents: write
  actions: read

concurrency:
  group: summarize-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_ENV: production
  TZ: Asia/Tokyo

jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: |
          npm ci
          node -v && npm -v

      - name: Derive flags & env (no secrets in if)
        id: derive
        shell: bash
        run: |
          set -Eeuo pipefail

          STYLE="${{ github.event.inputs.style }}"
          LANG="${{ github.event.inputs.lang }}"
          MODEL="${{ github.event.inputs.model }}"
          DOCS_PATH_INPUT="${{ github.event.inputs.docs_path }}"
          PUBLISH_INPUT="${{ github.event.inputs.publish_to_docs }}"

          [[ -z "$STYLE" ]] && STYLE=general
          [[ -z "$LANG" ]] && LANG=ja
          [[ -z "$MODEL" ]] && MODEL=gemini-2.5-flash
          [[ -z "$DOCS_PATH_INPUT" ]] && DOCS_PATH_INPUT="docs/ai-news-bot"

          echo "STYLE=$STYLE" >> "$GITHUB_ENV"
          echo "LANG=$LANG" >> "$GITHUB_ENV"
          echo "MODEL=$MODEL" >> "$GITHUB_ENV"
          echo "DOCS_PATH=$DOCS_PATH_INPUT" >> "$GITHUB_ENV"
          if [[ "$PUBLISH_INPUT" == "true" ]]; then
            echo "PUBLISH_TO_DOCS=true" >> "$GITHUB_ENV"
          else
            echo "PUBLISH_TO_DOCS=false" >> "$GITHUB_ENV"
          fi

          # Prefer GEMINI_API_KEY, fallback GOOGLE_API_KEY
          if [[ -n "${{ secrets.GEMINI_API_KEY }}" ]]; then
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> "$GITHUB_ENV"
          elif [[ -n "${{ secrets.GOOGLE_API_KEY }}" ]]; then
            echo "GEMINI_API_KEY=${{ secrets.GOOGLE_API_KEY }}" >> "$GITHUB_ENV"
          else
            echo "NO_API_KEY=1" >> "$GITHUB_ENV"
          fi

          # Discord webhook availability flag
          if [[ -n "${{ secrets.DISCORD_WEBHOOK_URL }}" ]]; then
            echo "HAS_DISCORD_WEBHOOK=true" >> "$GITHUB_ENV"
          else
            echo "HAS_DISCORD_WEBHOOK=false" >> "$GITHUB_ENV"
          fi

          # Require either url or seed_file
          URL="${{ github.event.inputs.url }}"
          SEED="${{ github.event.inputs.seed_file }}"
          if [[ -z "$URL" && -z "$SEED" ]]; then
            echo "::error::Either 'url' or 'seed_file' is required."
            exit 22
          fi

      - name: Fail early when API key missing
        if: env.NO_API_KEY == '1'
        run: |
          echo "::error::GEMINI_API_KEY or GOOGLE_API_KEY is required in repository secrets."
          exit 2

      # === ここから 2.5-flash 固定の事前疎通チェック（モデルは変えません） ===
      - name: Gemini preflight (gemini-2.5-flash)
        env:
          GEMINI_API_KEY: ${{ env.GEMINI_API_KEY }}
        run: |
          set -Eeuo pipefail
          echo "Checking Gemini 2.5 Flash connectivity…"
          STATUS=$(curl -s -o preflight.json -w "%{http_code}" \
            -H 'Content-Type: application/json' \
            -H "x-goog-api-key: ${GEMINI_API_KEY}" \
            -d '{"contents":[{"parts":[{"text":"ping"}]}]}' \
            'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent')
          echo "status=$STATUS"
          if [[ "$STATUS" -lt 200 || "$STATUS" -ge 300 ]]; then
            echo "::error::Gemini preflight failed (HTTP $STATUS) with model=gemini-2.5-flash"
            tail -c 2000 preflight.json || true
            exit 3
          fi

      - name: Preflight (deps & inputs)
        run: |
          set -Eeuo pipefail
          node - <<'JS'
          try {
            require('jsdom'); require('@mozilla/readability'); require('undici');
            console.log('deps: ok');
          } catch (e) {
            console.error('deps: missing ->', e?.message || e);
            process.exit(2);
          }
          JS

      # === ここが落ちていたステップ（名称はそのまま保持） ===
      - name: Run summarize.mjs
        id: run_summary
        env:
          GEMINI_API_KEY: ${{ env.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ env.GEMINI_API_KEY }}   # ← 追加：エイリアス
          NODE_OPTIONS: --dns-result-order=ipv4first
        run: |
          set -Eeuo pipefail
          set -x

          mkdir -p out/summary summary || true

          CMD=(node --unhandled-rejections=strict --trace-uncaught scripts/summarize.mjs --style "$STYLE" --lang "$LANG" --model "$MODEL")
          if [[ -n "${{ github.event.inputs.url }}" ]]; then
            CMD+=(--url "${{ github.event.inputs.url }}")
          fi
          if [[ -n "${{ github.event.inputs.seed_file }}" ]]; then
            CMD+=(--seed-file "${{ github.event.inputs.seed_file }}")
          fi
          echo "+ ${CMD[*]}"

          # 3回までリトライ（10s/20s バックオフ）
          ATTEMPT=0
          until "${CMD[@]}" 2>&1 | tee summarize.log; do
            EXIT_CODE=$?
            ATTEMPT=$((ATTEMPT+1))
            if [[ $ATTEMPT -ge 3 ]]; then
              echo "summarize.mjs failed after ${ATTEMPT} attempts (exit=$EXIT_CODE)"
              exit $EXIT_CODE
            fi
            S=$((ATTEMPT*10))
            echo "retry in ${S}s ..."
            sleep $S
          done
          set +x

      - name: Upload debug log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: summarize-log
          path: |
            summarize.log
            preflight.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload artifact (summary)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: summary
          path: |
            summary/**
            out/summary/**
          if-no-files-found: warn
          retention-days: 14

      - name: Publish to docs
        if: env.PUBLISH_TO_DOCS == 'true'
        run: |
          set -Eeuo pipefail
          if [[ -d "out/summary" ]]; then SRC="out/summary"
          elif [[ -d "summary" ]]; then SRC="summary"
          else
            echo "No summary directory found. Skipping docs publish."
            exit 0
          fi
          mkdir -p "$DOCS_PATH"
          rsync -a --delete "$SRC"/ "$DOCS_PATH"/

          if ! git diff --quiet; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$DOCS_PATH"
            git commit -m "docs: update AI news summary (run $GITHUB_RUN_NUMBER)"
            git push
          else
            echo "No changes to commit."
          fi

      - name: Build Discord payload (Python only)
        id: build_msg
        if: env.HAS_DISCORD_WEBHOOK == 'true'
        run: |
          python3 - <<'PY'
          import json, os
          repo = os.environ.get("GITHUB_REPOSITORY","")
          run_id = os.environ.get("GITHUB_RUN_ID","")
          publish = os.environ.get("PUBLISH_TO_DOCS","false") == "true"
          docs = os.environ.get("DOCS_PATH","docs/ai-news-bot")
          lines = [
            "✅ AIニュース要約が完了しました",
            f"- repo: {repo}",
            f"- run : https://github.com/{repo}/actions/runs/{run_id}",
            "- artifact: summary",
          ]
          if publish:
              lines.append(f"- docs: {docs}")
          text = "\n".join(lines)
          if len(text) > 1900:
              text = text[:1900] + "…"
          with open("payload.json","w",encoding="utf-8") as f:
              json.dump({"content": text}, f, ensure_ascii=False)
          print("payload.json written")
          PY

      - name: Notify Discord
        if: env.HAS_DISCORD_WEBHOOK == 'true'
        continue-on-error: true
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -Eeuo pipefail
          curl -fsS -X POST "$WEBHOOK?wait=true" \
            -H "Content-Type: application/json" \
            --data-binary @payload.json
