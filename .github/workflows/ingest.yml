name: ingest
on:
  repository_dispatch:
    types: [ingest_url]

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      GEMINI_MODEL: gemini-2.5-flash
      NEWS_ROOT: news
      LINK_MODE: obsidian
      AI_NEWS_OFFLINE: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci
      - run: npm run env:boot
      - name: Ingest URL
        run: node .dev/scripts/ingest_url.mjs --url "${{ github.event.client_payload.url }}"
      - name: Rebuild indexes
        run: |
          npm run daily
          npm run weekly
          npm run home
      - name: Commit
        run: |
          git config user.name "ai-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "ingest: ${{ github.event.client_payload.url }}" || echo "no changes"
          git push
